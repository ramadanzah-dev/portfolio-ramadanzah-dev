<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Alchemist Clicker</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="shortcut icon" href="../img/-_-.png" type="image/x-icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Space+Grotesk', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .quantum-orb {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .quantum-orb-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #3b82f6 0%, #1e40af 70%, #1e3a8a 100%);
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.5);
            cursor: pointer;
            transition: transform 0.1s active, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantum-orb-inner:active {
            transform: scale(0.92);
        }

        .quantum-orb::after {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 50%;
            border: 2px solid rgba(59, 130, 246, 0.3);
            animation: pulse 2s infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .particle {
            position: absolute;
            pointer-events: none;
            animation: float-up 1s ease-out forwards;
            z-index: 50;
        }

        @keyframes float-up {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120px) scale(0.5); opacity: 0; }
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .upgrade-card {
            transition: all 0.2s;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .upgrade-card:hover:not(.disabled) {
            background: rgba(51, 65, 85, 0.8);
            transform: translateY(-2px);
        }

        .disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .modal {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row bg-[#0f172a]">

    <!-- Area Utama Game -->
    <main class="w-full md:flex-1 flex flex-col items-center justify-center p-6 relative overflow-hidden min-h-[70vh] md:min-h-screen">
        
        <!-- Navbar Atas -->
        <div class="absolute top-6 left-6 right-6 z-20 flex justify-between items-center gap-2">
            <div class="flex items-center gap-2 bg-slate-900/60 p-2 rounded-2xl border border-white/10 backdrop-blur-md">
                <button id="toggle-audio" title="Suara" class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center border border-slate-700 hover:bg-slate-700 transition">
                    <i class="fas fa-volume-up text-blue-400"></i>
                </button>
                <button id="toggle-music" title="Musik" class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center border border-slate-700 hover:bg-slate-700 transition">
                    <i class="fas fa-music text-purple-400"></i>
                </button>
                <div class="w-[1px] h-6 bg-slate-700 mx-1"></div>
                <button id="open-prestige" title="Quantum Reset" class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center border border-amber-500/50 hover:bg-amber-900 transition text-amber-400">
                    <i class="fas fa-star"></i>
                </button>
            </div>
            
            <button id="exit-game" class="h-10 px-4 rounded-xl bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white border border-red-500/30 transition-all flex items-center gap-2 font-bold shadow-lg">
                <i class="fas fa-sign-out-alt"></i>
                <span class="hidden sm:inline">Keluar</span>
            </button>
        </div>

        <div id="particles-container" class="absolute inset-0 z-0"></div>

        <div class="z-10 text-center mb-8 mt-12 md:mt-0">
            <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500 mb-2">
                ALCHEMIST QUANTUM
            </h1>
            <p id="multiplier-display" class="text-amber-400 text-xs font-bold tracking-widest uppercase">Multiplier: 1.0x</p>
        </div>

        <div class="z-10 relative mb-12">
            <div id="clicker-orb" class="quantum-orb">
                <div class="quantum-orb-inner">
                    <i class="fas fa-atom text-6xl text-blue-200 animate-spin-slow"></i>
                </div>
            </div>
        </div>

        <div class="z-10 text-center glass-panel p-6 rounded-3xl w-full max-w-xs shadow-2xl">
            <div class="text-xs text-blue-400 uppercase tracking-widest mb-1 font-semibold">Energi Terkumpul</div>
            <div id="energy-display" class="text-4xl font-bold font-mono text-white">0</div>
            <div id="eps-display" class="text-sm text-slate-500 mt-2">EPS: 0</div>
        </div>
    </main>

    <!-- Sidebar Toko -->
    <aside class="w-full md:w-[400px] bg-[#111827] md:bg-[#1e293b]/70 md:backdrop-blur-xl border-t md:border-t-0 md:border-l border-slate-800 p-6 flex flex-col min-h-screen md:max-h-screen">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold flex items-center">
                <i class="fas fa-flask mr-3 text-purple-400"></i> Laboratorium
            </h2>
            <div class="text-[10px] bg-slate-800 px-2 py-1 rounded border border-slate-700 text-slate-400 uppercase font-bold">Store</div>
        </div>

        <!-- Upgrade List -->
        <div class="flex-1 md:overflow-y-auto space-y-3 pr-0 md:pr-2 mb-6" id="upgrade-list">
            <!-- Upgrade via JS -->
        </div>

        <!-- Footer Stats & Actions (Unified Design) -->
        <div class="mt-auto space-y-4">
            <!-- Panel Statistik Terpadu -->
            <div class="bg-slate-900/80 border border-white/5 rounded-2xl p-4 overflow-hidden relative">
                <div class="absolute top-0 right-0 p-4 opacity-5">
                    <i class="fas fa-chart-line text-4xl"></i>
                </div>
                <div class="grid grid-cols-2 gap-4 relative z-10">
                    <div>
                        <span class="text-[10px] text-slate-500 uppercase font-bold block mb-1">Total Klik</span>
                        <span id="stat-clicks" class="text-lg font-mono font-bold text-blue-100">0</span>
                    </div>
                    <div class="border-l border-white/10 pl-4">
                        <span class="text-[10px] text-amber-500/70 uppercase font-bold block mb-1">Quantum Shards</span>
                        <span id="stat-shards" class="text-lg font-mono font-bold text-amber-400">0</span>
                    </div>
                </div>
            </div>
            
            <!-- Blok Tombol Terpadu -->
            <div class="bg-slate-900/40 p-2 rounded-2xl border border-white/5 space-y-2">
                <button id="save-btn" class="w-full py-3 bg-blue-600/40 hover:bg-blue-500/10 border border-blue-500/30 rounded-xl text-sm transition flex items-center justify-center gap-2 font-bold text-white shadow-lg shadow-blue-900/20 active:scale-95">
                    <i class="fas fa-save"></i> Simpan Progres
                </button>
                <button id="reset-game" class="w-full py-3 bg-red-600/40 hover:bg-red-500/10 border border-red-500/30 rounded-xl text-sm transition flex items-center justify-center gap-2 font-bold text-white shadow-lg shadow-red-900/20 active:scale-95">
                    <i class="fas fa-trash-alt"></i> Hapus Semua Data
                </button>
            </div>
        </div>
    </aside>

    <!-- Prestige Modal -->
    <div id="prestige-modal" class="fixed inset-0 z-[100] modal hidden flex items-center justify-center p-4">
        <div class="max-w-md w-full glass-panel rounded-3xl p-8 border-amber-500/30 text-center shadow-2xl">
            <div class="w-20 h-20 bg-amber-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-redo-alt text-4xl text-amber-400"></i>
            </div>
            <h2 class="text-3xl font-bold mb-2">Quantum Reset</h2>
            <p class="text-slate-400 mb-8 text-sm leading-relaxed">Meriset mesin kamu sekarang akan menghasilkan <b>Quantum Shards</b> yang memberikan bonus energi permanen sebesar 10% per shard.</p>
            
            <div class="bg-slate-900/80 rounded-2xl p-5 mb-8 border border-amber-500/20">
                <div class="text-xs text-slate-500 uppercase tracking-widest mb-2 font-bold">Potensi Perolehan Shard</div>
                <div id="potential-shards" class="text-4xl font-bold text-amber-400">0</div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button id="close-prestige" class="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold transition text-white">Batal</button>
                <button id="confirm-prestige" class="py-3 bg-amber-600 hover:bg-amber-500 rounded-xl font-bold text-slate-900 transition disabled:opacity-30 disabled:grayscale">Mulai Baru</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 md:left-6 md:translate-x-0 glass-panel px-6 py-3 rounded-full text-sm font-bold translate-y-32 transition-all duration-300 pointer-events-none z-[110] border-blue-500/30 text-blue-100 shadow-xl">
        Pesan...
    </div>

    <script>
        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isAudioEnabled = true;
        let isMusicEnabled = false;
        let musicNode = null;

        function playSynthSound(freq, type, duration, vol) {
            if (!isAudioEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(freq / 2, audioCtx.currentTime + duration);
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function startAmbience() {
            if (musicNode) return;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc1.type = 'sine'; osc1.frequency.value = 110;
            osc2.type = 'triangle'; osc2.frequency.value = 111;
            gain.gain.value = 0.05;
            osc1.connect(gain); osc2.connect(gain);
            gain.connect(audioCtx.destination);
            osc1.start(); osc2.start();
            musicNode = { osc1, osc2, gain };
        }

        function stopAmbience() {
            if (musicNode) {
                musicNode.osc1.stop(); musicNode.osc2.stop();
                musicNode = null;
            }
        }

        // --- GAME LOGIC ---
        const INITIAL_UPGRADES = [
            { id: 'u1', name: 'Micro-Reactor', cost: 15, baseEps: 1, owned: 0, icon: 'microchip', desc: 'Satu klik tiap detik.' },
            { id: 'u2', name: 'Catalyst Fluid', cost: 100, baseEps: 5, owned: 0, icon: 'vial', desc: 'Reaksi kimia dasar.' },
            { id: 'u3', name: 'Quantum Drill', cost: 500, baseEps: 12, owned: 0, icon: 'tools', desc: 'Menambang sub-atom.' },
            { id: 'u4', name: 'Fusion Core', cost: 2000, baseEps: 45, owned: 0, icon: 'sun', desc: 'Energi bintang murni.' },
            { id: 'u5', name: 'Void Manipulator', cost: 10000, baseEps: 150, owned: 0, icon: 'black-hole', desc: 'Kekuatan lubang hitam.' }
        ];

        let state = {
            energy: 0,
            totalClicks: 0,
            shards: 0,
            upgrades: JSON.parse(JSON.stringify(INITIAL_UPGRADES))
        };

        const orb = document.getElementById('clicker-orb');
        const energyDisplay = document.getElementById('energy-display');
        const epsDisplay = document.getElementById('eps-display');
        const upgradeList = document.getElementById('upgrade-list');
        const statClicks = document.getElementById('stat-clicks');
        const statShards = document.getElementById('stat-shards');
        const multiplierDisplay = document.getElementById('multiplier-display');
        const particlesContainer = document.getElementById('particles-container');
        const toast = document.getElementById('toast');
        const prestigeModal = document.getElementById('prestige-modal');

        function renderStore() {
            upgradeList.innerHTML = '';
            state.upgrades.forEach(upg => {
                const card = document.createElement('div');
                card.id = upg.id;
                card.className = `upgrade-card p-4 rounded-2xl flex items-center cursor-pointer transition-all ${state.energy < upg.cost ? 'disabled' : 'shadow-lg shadow-blue-900/10'}`;
                card.innerHTML = `
                    <div class="w-12 h-12 bg-slate-900 rounded-xl flex items-center justify-center mr-4 text-blue-400 border border-white/5">
                        <i class="fas fa-${upg.icon} text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-bold text-sm text-white">${upg.name}</div>
                        <div class="text-[10px] text-slate-500 mb-1">${upg.desc}</div>
                        <div class="text-blue-400 font-bold text-xs flex items-center">
                            <i class="fas fa-bolt mr-1 text-[10px]"></i> ${Math.floor(upg.cost).toLocaleString()}
                        </div>
                    </div>
                    <div class="ml-4 flex flex-col items-end">
                        <div class="text-2xl font-black text-slate-800">${upg.owned}</div>
                        <div class="text-[9px] text-slate-600 font-bold uppercase tracking-tighter">Miliki</div>
                    </div>
                `;
                card.onclick = () => buyUpgrade(upg.id);
                upgradeList.appendChild(card);
            });
        }

        function getMultiplier() {
            return 1 + (state.shards * 0.1); 
        }

        function calculateTotalEps() {
            const rawEps = state.upgrades.reduce((sum, upg) => sum + (upg.owned * upg.baseEps), 0);
            return rawEps * getMultiplier();
        }

        orb.onclick = (e) => {
            const clickBase = 1 + (calculateTotalEps() * 0.05);
            const clickValue = clickBase * getMultiplier();
            state.energy += clickValue;
            state.totalClicks++;
            
            playSynthSound(440, 'sine', 0.1, 0.2);
            createParticle(e.clientX, e.clientY, `+${clickValue.toFixed(1)}`);
            updateUI();
        };

        function createParticle(x, y, text) {
            const p = document.createElement('div');
            p.className = 'particle font-bold text-blue-400 drop-shadow-[0_0_10px_rgba(59,130,246,0.8)] text-xl';
            p.style.left = `${x}px`;
            p.style.top = `${y}px`;
            p.innerText = text;
            particlesContainer.appendChild(p);
            setTimeout(() => p.remove(), 1000);
        }

        function buyUpgrade(id) {
            const upg = state.upgrades.find(u => u.id === id);
            if (state.energy >= upg.cost) {
                state.energy -= upg.cost;
                upg.owned++;
                upg.cost *= 1.15;
                playSynthSound(880, 'square', 0.3, 0.1);
                updateUI();
                renderStore();
            } else {
                playSynthSound(150, 'sawtooth', 0.1, 0.05);
                showToast("Energi tidak cukup!");
            }
        }

        function updateUI() {
            energyDisplay.innerText = Math.floor(state.energy).toLocaleString();
            epsDisplay.innerText = `Energi Per Detik (EPS): ${calculateTotalEps().toFixed(1)}`;
            statClicks.innerText = state.totalClicks.toLocaleString();
            statShards.innerText = state.shards.toLocaleString();
            multiplierDisplay.innerText = `Multiplier: ${getMultiplier().toFixed(1)}x`;

            state.upgrades.forEach(upg => {
                const el = document.getElementById(upg.id);
                if (el) {
                    if (state.energy >= upg.cost) el.classList.remove('disabled');
                    else el.classList.add('disabled');
                }
            });
        }

        function getPotentialShards() {
            if (state.energy < 50000) return 0;
            return Math.floor(Math.sqrt(state.energy / 50000));
        }

        document.getElementById('open-prestige').onclick = () => {
            const potential = getPotentialShards();
            document.getElementById('potential-shards').innerText = potential.toLocaleString();
            document.getElementById('confirm-prestige').disabled = potential <= 0;
            prestigeModal.classList.remove('hidden');
        };

        document.getElementById('close-prestige').onclick = () => {
            prestigeModal.classList.add('hidden');
        };

        document.getElementById('confirm-prestige').onclick = () => {
            const gained = getPotentialShards();
            if (gained > 0) {
                state.shards += gained;
                state.energy = 0;
                state.upgrades = JSON.parse(JSON.stringify(INITIAL_UPGRADES));
                prestigeModal.classList.add('hidden');
                renderStore();
                updateUI();
                saveGame(true);
                showToast(`Reset Berhasil! Mendapatkan ${gained} Shards`);
            }
        };

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.remove('translate-y-32');
            toast.classList.add('translate-y-0');
            setTimeout(() => {
                toast.classList.remove('translate-y-0');
                toast.classList.add('translate-y-32');
            }, 3000);
        }

        document.getElementById('toggle-audio').onclick = function() {
            isAudioEnabled = !isAudioEnabled;
            this.querySelector('i').className = isAudioEnabled ? 'fas fa-volume-up text-blue-400' : 'fas fa-volume-mute text-slate-500';
            if (audioCtx.state === 'suspended') audioCtx.resume();
        };

        document.getElementById('toggle-music').onclick = function() {
            isMusicEnabled = !isMusicEnabled;
            this.querySelector('i').className = isMusicEnabled ? 'fas fa-music text-purple-400' : 'fas fa-music text-slate-500';
            if (isMusicEnabled) startAmbience(); else stopAmbience();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        };

        setInterval(() => saveGame(true), 60000);
        setInterval(() => {
            const eps = calculateTotalEps();
            if (eps > 0) {
                state.energy += eps / 10;
                updateUI();
            }
        }, 100);

        function saveGame(silent = false) {
            try {
                localStorage.setItem('quantum_clicker_v3', JSON.stringify(state));
                if(!silent) showToast("Progres Berhasil Disimpan ✨");
            } catch (e) {
                console.error("Save failed");
            }
        }

        function loadGame() {
            const saved = localStorage.getItem('quantum_clicker_v3');
            if (saved) {
                const loaded = JSON.parse(saved);
                state.energy = loaded.energy || 0;
                state.totalClicks = loaded.totalClicks || 0;
                state.shards = loaded.shards || 0;
                if (loaded.upgrades) {
                    loaded.upgrades.forEach((savedUpg, index) => {
                        if (state.upgrades[index]) {
                            state.upgrades[index].owned = savedUpg.owned || 0;
                            state.upgrades[index].cost = savedUpg.cost || INITIAL_UPGRADES[index].cost;
                        }
                    });
                }
            }
        }

        document.getElementById('exit-game').onclick = () => {
            saveGame(true);
            document.body.style.opacity = '0';
            setTimeout(() => window.location.href = "../game.html#projects", 500);
        };

        document.getElementById('reset-game').onclick = () => {
            if (confirm("⚠️ Hapus data? Kamu akan mengulang dari nol.")) {
                localStorage.removeItem('quantum_clicker_v3');
                location.reload();
            }
        };

        document.getElementById('save-btn').onclick = () => saveGame();

        window.onload = () => {
            loadGame();
            renderStore();
            updateUI();
        };
    </script>
</body>
</html>
