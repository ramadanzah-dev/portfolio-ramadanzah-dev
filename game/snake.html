<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game - Nokia Style with Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            background-color: #1a1a1a;
            font-family: 'VT323', monospace;
            touch-action: manipulation;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            background-color: #8bab1e; 
            border: 10px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            image-rendering: pixelated;
        }

        #game-canvas {
            display: block;
            background-color: #9bbc0f;
        }

        .btn-control {
            background-color: #333;
            color: white;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            user-select: none;
            font-size: 1.5rem;
            box-shadow: 0 4px 0 #000;
        }

        .btn-control:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #000;
        }

        /* Lobby Styles */
        .menu-btn {
            background-color: #0f380f;
            color: #9bbc0f;
            padding: 10px 25px;
            font-size: 2rem;
            margin: 10px;
            border: 4px solid #306230;
            transition: all 0.2s;
            width: 200px;
        }

        .menu-btn:hover {
            background-color: #306230;
            color: #0f380f;
            transform: scale(1.1);
        }

        .pixel-art-snake {
            font-size: 5rem;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="fixed inset-0 z-50 bg-[#1a1a1a] flex flex-col items-center justify-center">
        <div class="pixel-art-snake mb-4">🐍</div>
        <h1 class="text-7xl text-yellow-500 mb-8 tracking-widest">Retro Snake</h1>
        
        <button onclick="startGameFromLobby()" class="menu-btn">MAIN</button>
        <button onclick="exitGame()" class="menu-btn">KELUAR</button>
        
        <p class="mt-12 text-gray-500 text-xl">© 2026 Retro Snake</p>
    </div>

    <!-- GAME UI (Hidden until start) -->
    <div id="game-ui" class="hidden flex flex-col items-center">
        <div class="mb-4 text-center">
            <div class="flex gap-8 text-2xl text-white">
                <p>SKOR: <span id="current-score">0</span></p>
                <p>TERTINGGI: <span id="high-score">0</span></p>
            </div>
        </div>

        <div class="game-container">
            <canvas id="game-canvas" width="400" height="400"></canvas>
            
            <!-- Game Over Overlay -->
            <div id="game-over" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center text-center p-4">
                <h2 class="text-red-500 text-6xl mb-4">MAMFUS!</h2>
                <p class="text-white text-2xl mb-6">Badan sendiri digigit...</p>
                <button onclick="resetGame()" class="bg-yellow-500 hover:bg-yellow-600 text-black text-2xl px-8 py-3 rounded-full transition-all font-bold">
                    COBA LAGI
                </button>
                <button onclick="backToLobby()" class="mt-4 text-white underline text-xl">Kembali ke Menu</button>
            </div>
        </div>

        <!-- Mobile Controls -->
        <div class="mt-8 grid grid-cols-3 gap-3 md:hidden">
            <div></div>
            <button class="btn-control" id="btn-up">▲</button>
            <div></div>
            <button class="btn-control" id="btn-left">◀</button>
            <button class="btn-control" id="btn-down">▼</button>
            <button class="btn-control" id="btn-right">▶</button>
        </div>

        <p class="mt-6 text-gray-400 text-lg hidden md:block italic">Gunakan tombol panah keyboard untuk belok atau a, s, d, w</p>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('current-score');
        const highScoreElement = document.getElementById('high-score');
        const gameOverScreen = document.getElementById('game-over');
        const lobbyScreen = document.getElementById('lobby-screen');
        const gameUi = document.getElementById('game-ui');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        highScoreElement.textContent = highScore;

        let snake = [];
        let food = {x: 5, y: 5};
        let dx = 0;
        let dy = -1;
        let nextDx = 0;
        let nextDy = -1;
        let gameSpeed = 100;
        let gameRunning = false;

        // --- SISTEM SUARA RETRO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, type, duration, volume = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const soundEffects = {
            eat: () => playSound(880, 'square', 0.1),
            move: () => playSound(150, 'sine', 0.05, 0.05),
            die: () => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        };

        // --- LOBBY LOGIC ---
        function startGameFromLobby() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            lobbyScreen.classList.add('hidden');
            gameUi.classList.remove('hidden');
            resetGame();
        }

        function exitGame() {
            // Mengarahkan ke file ../game.html
            window.location.href = '../game.html';
        }

        function backToLobby() {
            gameRunning = false;
            gameOverScreen.classList.add('hidden');
            gameUi.classList.add('hidden');
            lobbyScreen.classList.remove('hidden');
        }

        // --- GAME LOGIC ---
        window.onload = () => {
            document.addEventListener('keydown', handleKeyDown);
            setupMobileControls();
        };

        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            setTimeout(gameLoop, gameSpeed);
        }

        function update() {
            if (dx !== nextDx || dy !== nextDy) soundEffects.move();
            dx = nextDx;
            dy = nextDy;

            if (dx === 0 && dy === 0) return;

            let newX = snake[0].x + dx;
            let newY = snake[0].y + dy;

            if (newX < 0) newX = tileCount - 1;
            if (newX >= tileCount) newX = 0;
            if (newY < 0) newY = tileCount - 1;
            if (newY >= tileCount) newY = 0;

            const head = { x: newX, y: newY };

            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return gameOver();
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                soundEffects.eat();
                score += 10;
                scoreElement.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                if (gameSpeed > 60) gameSpeed -= 1;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.fillStyle = '#9bbc0f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#8bab1e';
            ctx.lineWidth = 0.5;
            for(let i=0; i<canvas.width; i+=gridSize) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
            }
            ctx.fillStyle = '#0f380f';
            ctx.fillRect(food.x * gridSize + 3, food.y * gridSize + 3, gridSize - 6, gridSize - 6);

            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#0f380f' : '#306230';
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
                if (index === 0) {
                    ctx.fillStyle = '#9bbc0f';
                    ctx.fillRect(part.x * gridSize + 4, part.y * gridSize + 4, 3, 3);
                    ctx.fillRect(part.x * gridSize + 13, part.y * gridSize + 4, 3, 3);
                }
            });
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            if (snake.some(p => p.x === food.x && p.y === food.y)) generateFood();
        }

        function handleKeyDown(e) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const key = e.key;
            if ((key === 'ArrowUp' || key === 'w') && dy !== 1) { nextDx = 0; nextDy = -1; }
            if ((key === 'ArrowDown' || key === 's') && dy !== -1) { nextDx = 0; nextDy = 1; }
            if ((key === 'ArrowLeft' || key === 'a') && dx !== 1) { nextDx = -1; nextDy = 0; }
            if ((key === 'ArrowRight' || key === 'd') && dx !== -1) { nextDx = 1; nextDy = 0; }
        }

        function setupMobileControls() {
            const handleTouch = (nx, ny) => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                if ((nx !== 0 && nx !== -dx) || (ny !== 0 && ny !== -dy)) {
                    nextDx = nx; nextDy = ny;
                }
            };
            document.getElementById('btn-up').onclick = () => handleTouch(0, -1);
            document.getElementById('btn-down').onclick = () => handleTouch(0, 1);
            document.getElementById('btn-left').onclick = () => handleTouch(-1, 0);
            document.getElementById('btn-right').onclick = () => handleTouch(1, 0);
        }

        function gameOver() {
            soundEffects.die();
            gameRunning = false;
            gameOverScreen.classList.remove('hidden');
        }

        function resetGame() {
            snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
            score = 0;
            scoreElement.textContent = score;
            nextDx = 0; nextDy = -1;
            dx = 0; dy = -1;
            gameSpeed = 100;
            gameRunning = true;
            generateFood();
            gameOverScreen.classList.add('hidden');
            gameLoop();
        }
    </script>
</body>
</html>
