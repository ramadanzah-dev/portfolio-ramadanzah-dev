<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminal Portfolio | Ramadanzah</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap");

      :root {
        --bg-color: #0d1117;
        --text-color: #c9d1d9;
        --prompt-user: #7ee787;
        --prompt-path: #58a6ff;
        --highlight: #f2cc60;
        --error: #f85149;
        --link: #79c0ff;
      }

      * {
        box-sizing: border-box;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        line-height: 1.5;
        overflow: hidden;
      }

      #terminal-container {
        width: 100%;
        height: 100%;
        padding: 20px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #30363d var(--bg-color);
      }

      #terminal-container::-webkit-scrollbar {
        width: 8px;
      }
      #terminal-container::-webkit-scrollbar-track {
        background: var(--bg-color);
      }
      #terminal-container::-webkit-scrollbar-thumb {
        background-color: #30363d;
        border-radius: 4px;
      }

      .output-line {
        margin-bottom: 4px;
        word-wrap: break-word;
        white-space: pre-wrap;
      }

      .prompt-span {
        color: var(--prompt-user);
        font-weight: bold;
      }

      .path-span {
        color: var(--prompt-path);
        font-weight: bold;
      }

      .symbol-span {
        color: var(--text-color);
      }

      /* Perbaikan: Mengubah ke baseline agar input sejajar dengan teks path walau diauto-format */
      .command-input-container {
        display: flex;
        align-items: baseline;
        margin-top: 4px;
      }

      /* Perbaikan: Menggunakan nowrap mencegah masalah enter di auto-format HTML */
      .prompt-container {
        white-space: nowrap;
        margin-right: 8px;
      }

      #command {
        background: transparent;
        border: none;
        color: var(--text-color);
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        flex-grow: 1;
        outline: none;
        padding: 0;
        margin: 0;
        line-height: 1.5;
      }

      .color-highlight {
        color: var(--highlight);
      }
      .color-error {
        color: var(--error);
      }
      .color-success {
        color: var(--prompt-user);
      }
      .color-path {
        color: var(--prompt-path);
      }

      a {
        color: var(--link);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      /* ASCII Art Styling */
      .ascii-art {
        color: var(--prompt-path);
        white-space: pre;
        font-weight: bold;
        margin-bottom: 20px;
        font-size: 12px;
        line-height: 1.2;
      }

      /* Neofetch Styling */
      .neofetch-container {
        display: flex;
        align-items: center;
        gap: 24px;
        margin: 15px 0;
      }

      .neofetch-ascii {
        white-space: pre;
        font-weight: bold;
        line-height: 1.2;
      }

      .neofetch-info {
        display: flex;
        flex-direction: column;
      }

      .neofetch-colors {
        display: flex;
        margin-top: 8px;
      }

      .color-block {
        width: 16px;
        height: 16px;
        display: inline-block;
      }

      .bg-black {
        background-color: #30363d;
      }
      .bg-red {
        background-color: #f85149;
      }
      .bg-green {
        background-color: #7ee787;
      }
      .bg-yellow {
        background-color: #f2cc60;
      }
      .bg-blue {
        background-color: #58a6ff;
      }
      .bg-magenta {
        background-color: #bc8cff;
      }
      .bg-cyan {
        background-color: #79c0ff;
      }
      .bg-white {
        background-color: #c9d1d9;
      }

      .neofetch-avatar-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-width: 120px;
      }

      @media (max-width: 600px) {
        body,
        html,
        #command {
          font-size: 13px;
        }
        .ascii-art {
          font-size: 8px;
        }
        .neofetch-container {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div id="terminal-container">
      <div id="output"></div>
      <div class="command-input-container" id="input-container">
        <div class="prompt-container">
          <span class="prompt-span">guest@portfolio</span>:<span
            class="path-span"
            id="prompt-path"
            >~</span
          ><span class="symbol-span">$</span>
        </div>
        <input
          type="text"
          id="command"
          autocomplete="off"
          spellcheck="false"
          autofocus
        />
      </div>
    </div>

    <script>
      const outputElement = document.getElementById("output");
      const inputElement = document.getElementById("command");
      const terminalContainer = document.getElementById("terminal-container");
      const promptPathElement = document.getElementById("prompt-path");

      // Fokuskan input saat area terminal diklik
      terminalContainer.addEventListener("click", () => {
        inputElement.focus();
      });

      const bootMessage = `Memulai sistem...
Memuat modul portfolio... [OK]
Membangun koneksi... [OK]

Ketik <span class="color-highlight">'help'</span> untuk melihat daftar perintah yang tersedia.
`;

      const portfolioData = {
        about: `Halo! Saya <span class="color-highlight">Ramadanzah</span>.
Seorang <span class="color-success">Full-stack Software Engineer</span> yang bersemangat dalam membangun aplikasi web yang skalabel dan efisien. 
Saya memiliki pengalaman dalam menggunakan teknologi seperti JavaScript, Python, dan PHP.
Saat saya tidak sedang coding, saya biasanya membaca atau bermain game.`,

        skills: `================ KEAHLIAN TEKNIS ================
<span class="color-path">Bahasa Pemrograman:</span> JavaScript, Python, PHP, HTML/CSS
<span class="color-path">Frameworks & Libs:</span> React.js, Node.js, TailwindCSS, Laravel
<span class="color-path">Database:</span>          MySQL, PostgreSQL, SQLite
<span class="color-path">Tools & DevOps:</span>    Git, Docker
=================================================`,

        projects: `==================== PROYEK =====================
<span class="color-highlight">1. Terminal Portfolio</span>
   - Portofolio interaktif berbasis CLI menggunakan Vanilla JS.
   - Menggunakan font JetBrains Mono untuk estetika terminal asli.
   - [Tautan]: <a href="https://github.com/ramadanzah/terminal-portofolio" target="_blank">github.com/ramadanzah/terminal-portofolio</a>

<span class="color-highlight">2. Sistem Inventori Web</span>
   - Dibangun dengan React dan Node.js.
   - Mengelola stok barang secara real-time.
=================================================`,

        contact: `==================== KONTAK =====================
Email:    <a href="mailto:ramadanzah205@gmail.com">ramadanzah205@gmail.com</a>
GitHub:   <a href="https://github.com/ramadanzah-dev" target="_blank">github.com/ramadanzah-dev</a>
LinkedIn: <a href="https://linkedin.com" target="_blank">linkedin.com/in/ramadanzah</a>
=================================================`,
      };

      const commands = {
        help: `Perintah yang tersedia:
  <span class="color-highlight">about</span>        - Menampilkan profil singkat saya
  <span class="color-highlight">skills</span>       - Menampilkan daftar keahlian teknis
  <span class="color-highlight">projects</span>     - Menampilkan daftar proyek utama
  <span class="color-highlight">contact</span>      - Menampilkan informasi kontak dan sosial media
  <span class="color-highlight">neofetch</span>     - Menampilkan informasi biodata ringkas
  <span class="color-highlight">cd</span>           - Pindah direktori (contoh: cd .., cd about)
  <span class="color-highlight">pwd</span>          - Menampilkan path / direktori saat ini
  <span class="color-highlight">ls</span>           - Menampilkan daftar direktori
  <span class="color-highlight">clear</span>        - Membersihkan layar terminal
  <span class="color-highlight">whoami</span>       - Menampilkan user saat ini`,

        about: portfolioData.about,
        skills: portfolioData.skills,
        projects: portfolioData.projects,
        contact: portfolioData.contact,
        whoami: `guest`,
      };

      let currentPath = "~";
      const validDirs = ["about", "skills", "projects", "contact"];

      function updatePrompt() {
        promptPathElement.innerText = currentPath;
      }

      function getNeofetch() {
        const avatarContent = `
    <div class="neofetch-ascii">
 ▄       ▄
▄ ▀▄   ▄▀ ▄
█▄█▀███▀█▄█
▀█████████▀
 ▄▀     ▀▄ 
    </div>`;

        return `
<div class="neofetch-container">
    <div class="neofetch-avatar-container">
        ${avatarContent}
    </div>
    <div class="neofetch-info">
        <div><span class="prompt-span">ramadanzah</span>@<span class="prompt-span">portfolio</span></div>
        <div>---------------------</div>
        <div><span class="color-path">Name</span>: Ramadanzah</div>
        <div><span class="color-path">Role</span>: Software Engineer</div>
        <div><span class="color-path">Location</span>: Bandar Lampung, Indonesia</div>
        <div><span class="color-path">Experience</span>: 3+ Years</div>
        <div><span class="color-path">Languages</span>: JavaScript, Python, PHP, Laravel</div>
        <div><span class="color-path">Hobbies</span>: Coding, Reading, Gaming, IoT</div>
        <div><span class="color-path">Status</span>: Open for Opportunities</div>
        <div><span class="color-path">Email</span>: ramadanzah205@gmail.com</div>
        <div class="neofetch-colors">
            <div class="color-block bg-black"></div>
            <div class="color-block bg-red"></div>
            <div class="color-block bg-green"></div>
            <div class="color-block bg-yellow"></div>
            <div class="color-block bg-blue"></div>
            <div class="color-block bg-magenta"></div>
            <div class="color-block bg-cyan"></div>
            <div class="color-block bg-white"></div>
        </div>
    </div>
</div>`;
      }

      function printHTML(html) {
        const div = document.createElement("div");
        div.className = "output-line";
        div.innerHTML = html;
        outputElement.appendChild(div);
        scrollToBottom();
      }

      function printCommandEcho(cmd) {
        const promptHTML = `<span class="prompt-span">guest@portfolio</span>:<span class="path-span">${currentPath}</span><span class="symbol-span">$</span> ${cmd}`;
        printHTML(promptHTML);
      }

      function scrollToBottom() {
        terminalContainer.scrollTop = terminalContainer.scrollHeight;
      }

      function initTerminal() {
        printHTML(getNeofetch());
        printHTML(bootMessage);
      }

      inputElement.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          const cmd = this.value.trim();
          this.value = "";

          if (cmd !== "") {
            printCommandEcho(cmd);
            processCommand(cmd);
          } else {
            printCommandEcho("");
          }
        }
      });

      function processCommand(cmdInput) {
        const args = cmdInput.split(" ").filter(Boolean);
        const cmd = args[0].toLowerCase();

        if (cmd === "clear" || cmd === "cls") {
          outputElement.innerHTML = "";
        } else if (cmd === "cd") {
          const target = args[1];
          if (!target || target === "~") {
            currentPath = "~";
          } else if (target === "..") {
            if (currentPath !== "~") {
              const parts = currentPath.split("/");
              parts.pop();
              currentPath = parts.length > 0 ? parts.join("/") : "~";
            }
          } else if (validDirs.includes(target)) {
            currentPath = `~/${target}`;
          } else {
            printHTML(`bash: cd: ${target}: No such file or directory`);
          }
          updatePrompt();
        } else if (cmd === "pwd") {
          let fullPath = "/home/guest";
          if (currentPath !== "~") {
            fullPath += currentPath.substring(1);
          }
          printHTML(fullPath);
        } else if (cmd === "ls") {
          if (currentPath === "~") {
            printHTML(
              `<span class="color-path">about/</span>  <span class="color-path">skills/</span>  <span class="color-path">projects/</span>  <span class="color-path">contact/</span>`,
            );
          } else {
            printHTML(` `); // Jika di dalam folder, dianggap kosong
          }
        } else if (cmd === "neofetch" || cmd === "fastfetch") {
          printHTML(getNeofetch());
        } else if (validDirs.includes(cmd)) {
          // Mengubah path secara otomatis dan menampilkan datanya
          currentPath = `~/${cmd}`;
          updatePrompt();
          printHTML(commands[cmd]);
        } else if (commands[cmd]) {
          printHTML(commands[cmd]);
        } else if (cmd === "exit") {
          printHTML("Sesi diakhiri. Silakan tutup tab browser ini.");
          document.getElementById("input-container").style.display = "none";
        } else {
          printHTML(
            `bash: ${cmd}: <span class="color-error">perintah tidak ditemukan</span>. Ketik <span class="color-highlight">'help'</span> untuk bantuan.`,
          );
        }
      }

      // Jalankan saat load
      window.onload = initTerminal;
    </script>
  </body>
</html>
